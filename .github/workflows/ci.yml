name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PatientIntakeApp.Tests/PatientIntakeApp.Tests.csproj

      - name: Build
        run: dotnet build PatientIntakeApp.Tests/PatientIntakeApp.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test PatientIntakeApp.Tests/PatientIntakeApp.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage"
